[project]
name = "gym-info"
version = "0.1.0"
description = "Information-theoretic metrics for Gymnasium environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.2.2",
  "numpy>=1.24",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.10",
]